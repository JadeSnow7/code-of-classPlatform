# Production Docker Compose Configuration
# - nginx provides the unified entrypoint on port 80.
# - frontend is built from the monorepo workspaces (React + Vite).

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in code/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-emfield_platform}
      MYSQL_USER: ${MYSQL_USER:-emfield_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in code/.env}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ../../ai_service
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      AI_MULTIMODAL_ENABLED: ${AI_MULTIMODAL_ENABLED:-false}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      AI_GATEWAY_SHARED_TOKEN: ${AI_GATEWAY_SHARED_TOKEN:?set AI_GATEWAY_SHARED_TOKEN in code/.env}
      BACKEND_INTERNAL_BASE_URL: http://backend:8080
      DEMO_HARD_FALLBACK: "false"
      LLM_BASE_URL_LOCAL_TEXT: ${LLM_BASE_URL_LOCAL_TEXT:-}
      LLM_API_KEY_LOCAL_TEXT: ${LLM_API_KEY_LOCAL_TEXT:-}
      LLM_MODEL_LOCAL_TEXT: ${LLM_MODEL_LOCAL_TEXT:-}
      LLM_BASE_URL_LOCAL_VL: ${LLM_BASE_URL_LOCAL_VL:-}
      LLM_API_KEY_LOCAL_VL: ${LLM_API_KEY_LOCAL_VL:-}
      LLM_MODEL_LOCAL_VL: ${LLM_MODEL_LOCAL_VL:-}
      LLM_BASE_URL_CLOUD_TEXT: ${LLM_BASE_URL_CLOUD_TEXT:-}
      LLM_API_KEY_CLOUD_TEXT: ${LLM_API_KEY_CLOUD_TEXT:-}
      LLM_MODEL_CLOUD_TEXT: ${LLM_MODEL_CLOUD_TEXT:-}
      LLM_BASE_URL_CLOUD_VL: ${LLM_BASE_URL_CLOUD_VL:-}
      LLM_API_KEY_CLOUD_VL: ${LLM_API_KEY_CLOUD_VL:-}
      LLM_MODEL_CLOUD_VL: ${LLM_MODEL_CLOUD_VL:-}
      GRAPH_RAG_ENABLED: ${GRAPH_RAG_ENABLED:-false}
      GRAPH_RAG_INDEX_PATH: ${GRAPH_RAG_INDEX_PATH}
      GRAPH_RAG_SEED_TOP_K: ${GRAPH_RAG_SEED_TOP_K}
      GRAPH_RAG_EXPAND_HOPS: ${GRAPH_RAG_EXPAND_HOPS}
      GRAPH_RAG_FINAL_TOP_K: ${GRAPH_RAG_FINAL_TOP_K}
      GRAPH_RAG_MAX_CONTEXT_CHARS: ${GRAPH_RAG_MAX_CONTEXT_CHARS}
    volumes:
      - ./data/ai-service:/app/app/data
  multi-agent:
    build:
      context: ../../../multi-agent/cloud
    restart: always
    environment:
      MULTI_AGENT_HOST: 0.0.0.0
      MULTI_AGENT_PORT: 8003
      GRAPHRAGX_BASE_URL: ${GRAPHRAGX_BASE_URL:-http://graphragx:8080}
      MULTI_AGENT_ENABLE_SANDBOX: ${MULTI_AGENT_ENABLE_SANDBOX:-false}
  sim:
    build:
      context: ../../simulation
    restart: always

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in code/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in code/.env}
    volumes:
      - ./data/minio:/data

  backend:
    build:
      context: ../../backend
    restart: always
    environment:
      HTTP_ADDR: ${BACKEND_HTTP_ADDR:-:8080}
      JWT_SECRET: ${BACKEND_JWT_SECRET:?set BACKEND_JWT_SECRET in code/.env}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?set BACKEND_CORS_ORIGINS in code/.env}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:?set PUBLIC_WEB_BASE_URL in code/.env}
      DB_DSN: ${BACKEND_DB_DSN:?set BACKEND_DB_DSN in code/.env}
      AI_BASE_URL: ${BACKEND_AI_BASE_URL:-http://ai:8001}
      MULTI_AGENT_BASE_URL: ${BACKEND_MULTI_AGENT_BASE_URL:-http://multi-agent:8003}
      AI_ORCHESTRATED_ENABLED: ${BACKEND_AI_ORCHESTRATED_ENABLED:-true}
      SIM_BASE_URL: ${BACKEND_SIM_BASE_URL:-http://sim:8002}
      AI_GATEWAY_SHARED_TOKEN: ${AI_GATEWAY_SHARED_TOKEN:?set AI_GATEWAY_SHARED_TOKEN in code/.env}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      WECOM_CORPID: ${WECOM_CORPID:-}
      WECOM_AGENTID: ${WECOM_AGENTID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in code/.env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in code/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-emfield-uploads}
      MINIO_USE_SSL: "false"
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_started
      multi-agent:
        condition: service_started
      sim:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

networks:
  default:
    name: emfield-network
