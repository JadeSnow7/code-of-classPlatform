server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip，减少首屏资源体积。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml;

    # 前端静态资源强缓存。文件名带 hash，可安全长期缓存。
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 常见静态文件做短一些的缓存，避免 favicon/manifest 频繁回源。
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 所有业务 API 统一转发到 SeeTaCloud 后端经 FRP 回源到本机的 18080 端口。
    location /api/v1/ {
        proxy_pass http://host.docker.internal:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # SPA 路由支持：所有未知路径都回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
