[workspace]
resolver = "2"
members = [
  "crates/router_core",
  "crates/sync_core",
  "crates/ffi_bridge",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["ClassPlatform Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
